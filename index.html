<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4f7;--card:#fff;--ink:#6e4458;--rose:#ee86a8;--rose-d:#d9648c;--pink:#f8bcd0;--peach:#ffe3d6;--lilac:#ebdffa;--mute:#b08a9d;--line:#f7d0de;
--script:'Marck Script','Segoe Script',cursive;--serif:'Nunito','Trebuchet MS',sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background-color:var(--bg);background-image:radial-gradient(#fbd3e0 1.6px,transparent 1.8px);background-size:28px 28px;
color:var(--ink);font:18px/1.7 var(--serif);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.locked{overflow:hidden}
h1,h2{font-family:var(--script);font-weight:400;line-height:1.1}
section{padding:80px 24px;max-width:960px;margin:0 auto}
h2{font-size:clamp(2.3rem,7vw,3.5rem);text-align:center;margin-bottom:44px;color:var(--rose-d)}

/* Envelope intro */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
background:radial-gradient(circle at 20% 15%,#ffd6e4,transparent 50%),radial-gradient(circle at 85% 85%,#ebdffa,transparent 50%),var(--bg);
transition:opacity .9s ease,visibility 0s .9s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro .to{font:400 clamp(2.4rem,9vw,3.6rem) var(--script);color:var(--rose-d);text-align:center}
#intro .hint{color:var(--mute);font-style:italic;transition:opacity .3s}
.env{position:relative;width:min(84vw,380px);aspect-ratio:3/2;background:none;border:0;cursor:pointer;perspective:900px;margin-top:40px;font:inherit}
.env-back{position:absolute;inset:0;background:#f4a4c0;border-radius:12px;box-shadow:0 22px 44px rgba(238,134,168,.45)}
.env-letter{position:absolute;left:7%;right:7%;top:7%;bottom:5%;background:#fff;border-radius:8px;z-index:2;display:grid;place-items:center;
font:400 clamp(1.8rem,7vw,2.4rem) var(--script);color:var(--rose-d);box-shadow:0 4px 14px rgba(238,134,168,.3);transition:transform 1s ease .55s}
.env-front{position:absolute;inset:0;z-index:3;border-radius:12px;background:linear-gradient(#fbc4d8,#f8b3cc);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;top:0;width:100%;height:56%;z-index:4;background:#f7a9c5;clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;transition:transform .6s ease,z-index 0s .3s}
.seal{position:absolute;left:50%;top:44%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:5;background:var(--rose-d);color:#fff;
display:grid;place-items:center;font-size:24px;box-shadow:0 4px 10px rgba(180,60,100,.4);animation:beat 1.6s ease-in-out infinite;transition:opacity .3s,transform .3s}
@keyframes beat{50%{transform:scale(1.14)}}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .env-letter{transform:translateY(-68%)}
.env.open .seal{opacity:0;transform:scale(1.8);animation:none}

/* Lion cast */
.lion{width:120px;height:130px;display:grid;place-items:end center;cursor:pointer;animation:bob 2.4s ease-in-out infinite;
transition:transform .2s;filter:drop-shadow(0 6px 10px rgba(110,68,88,.3))}
.lion img,.lion svg{max-width:100%;max-height:100%}
.lion.cast{animation:none;transform:scale(1.12) rotate(-6deg)}
@keyframes bob{50%{transform:translateY(-6px)}}
#bolt{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
#bolt path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:56}
.flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.env.hit{animation:shake .5s}
@keyframes shake{20%{transform:translate(-8px,2px) rotate(-2deg)}40%{transform:translate(8px,-2px) rotate(2deg)}60%{transform:translate(-6px,0)}80%{transform:translate(5px,0)}}
.fod{position:fixed;left:50%;top:16%;transform:translateX(-50%);font:400 clamp(1.8rem,8vw,2.8rem) var(--script);color:#9a3dff;
opacity:0;z-index:57;pointer-events:none;text-shadow:0 0 14px #e3bfff;white-space:nowrap}
.fod.on{animation:fod 1.3s ease-out}
@keyframes fod{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.1)}100%{opacity:0;transform:translateX(-50%) translateY(-24px)}}

/* Hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
padding:40px 24px;position:relative;overflow:hidden;
background:radial-gradient(circle at 15% 15%,#ffd6e4 0,transparent 45%),radial-gradient(circle at 88% 82%,#ebdffa 0,transparent 45%),radial-gradient(circle at 80% 10%,#ffe6d9 0,transparent 35%)}
.hero h1{font-size:clamp(4.6rem,20vw,9rem);color:var(--rose-d);text-shadow:3px 3px 0 #fff,0 8px 30px rgba(238,134,168,.4)}
.hero p.sub{font-size:1.15rem;color:var(--mute);font-style:italic;margin-top:8px;max-width:30ch}
.counter{display:flex;gap:clamp(8px,3vw,16px);margin-top:40px;flex-wrap:wrap;justify-content:center}
.counter div{min-width:76px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 10px;box-shadow:0 8px 20px rgba(238,134,168,.18)}
.counter b{display:block;font:400 clamp(2rem,8vw,2.8rem)/1.1 var(--script);color:var(--rose-d)}
.counter span{font-size:.85rem;color:var(--mute)}
.since{margin-top:16px;color:var(--mute);font-size:.95rem}
.down{margin-top:48px;color:var(--rose-d);text-decoration:none;font-family:var(--script);font-size:1.6rem}
.petal{position:absolute;top:-30px;color:var(--rose);opacity:.5;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

/* Album */
.book{max-width:560px;margin:0 auto;perspective:1600px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.tab{font:400 1.45rem var(--script);padding:6px 24px;border-radius:30px;border:2px solid var(--line);background:#fff;color:var(--rose-d);cursor:pointer}
.tab.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.cover{background:linear-gradient(135deg,#f9bfd3,#f092b2);border-radius:10px 24px 24px 10px;padding:14px 14px 14px 30px;
box-shadow:0 22px 50px rgba(238,134,168,.4),inset 10px 0 0 #ea7ba0,inset 12px 0 0 #fff}
.paper{background:#fffafc;border-radius:4px 14px 14px 4px;padding:16px 16px 20px;
transform-origin:left center;transition:transform .35s ease,opacity .35s ease;box-shadow:inset 14px 0 18px -14px rgba(180,80,120,.3)}
.paper.out-n{transform:rotateY(-85deg);opacity:0}
.paper.out-p{transform:rotateY(85deg);opacity:0}
.paper .ph{max-width:none;aspect-ratio:4/5;max-height:72vh;width:100%;margin:0;border:8px solid #fff;border-radius:4px;
background:linear-gradient(135deg,#ffe3ec,#ebdffa);transform:rotate(-.8deg);box-shadow:0 8px 22px rgba(190,90,130,.28);cursor:zoom-in}
.cap{font-family:var(--script);font-size:1.6rem;color:var(--rose-d);text-align:center;margin-top:14px;min-height:1.2em}
.nav{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:22px;color:var(--mute)}
.arrow{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--rose-d);font-size:28px;line-height:1;cursor:pointer}
.arrow:disabled{opacity:.35;cursor:default}
.ph{margin-top:16px;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;font-size:2.8rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(110,68,88,.9);display:none;place-items:center;z-index:60;padding:20px;cursor:zoom-out}
.lb.on{display:grid}.lb img{max-width:100%;max-height:90vh;border-radius:12px;border:8px solid #fff}

/* Quiz */
.card{background:#fff;border:2px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,40px);max-width:600px;margin:0 auto;
box-shadow:0 14px 40px rgba(238,134,168,.2);text-align:center}
.card h3{font:400 clamp(1.7rem,5vw,2.1rem)/1.2 var(--script);color:var(--rose-d);margin:6px 0 20px}
.qn{color:var(--mute);font-size:.95rem}
.opts{display:grid;gap:10px}
.opt{font:inherit;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:background .2s}
.opt:hover:not(:disabled){background:var(--peach)}
.opt.ok{background:#d8f3e3;border-color:#8fd3ae}.opt.bad{background:#ffd9df;border-color:#f19aab}
.big{font:400 3rem var(--script);color:var(--rose-d)}
/* Game */
.gwrap{max-width:360px;margin:0 auto;text-align:center}
#game{width:100%;height:auto;border-radius:24px;border:3px solid #fff;box-shadow:0 14px 40px rgba(238,134,168,.35);touch-action:manipulation;cursor:pointer;display:block;background:#ffe3ec}
.gbox{position:relative}
.gbanner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;
background:rgba(255,244,247,.94);border-radius:24px;text-align:center}
.gbanner.on{display:flex}
.gbanner p{font:400 clamp(1.7rem,7vw,2.1rem)/1.2 var(--script);color:var(--ink)}
.gnote{color:var(--mute);font-size:.9rem;margin-top:6px}
/* Scratch */
.scratch{position:relative;width:min(100%,440px);aspect-ratio:3/2;margin:0 auto;border-radius:26px;overflow:hidden;box-shadow:0 14px 40px rgba(238,134,168,.35);border:3px solid #fff}
.scratch .under{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:linear-gradient(135deg,#fff,#ffe3ec);
font:400 clamp(1.5rem,6vw,2.1rem)/1.25 var(--script);color:var(--rose-d)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .8s}

.snd{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:50px;height:50px;border-radius:50%;
border:2px solid var(--line);background:#fff;color:var(--rose-d);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(238,134,168,.35)}
.snd[hidden]{display:none}.snd.off{opacity:.65}

/* Pet */
.petbox{position:relative;max-width:260px;margin:0 auto 18px}
.pimg{transition:filter .5s}
.pimg .ph{margin:0;aspect-ratio:1;border:6px solid #fff;border-radius:28px;box-shadow:0 10px 26px rgba(190,90,130,.3);background:linear-gradient(135deg,#ffe3ec,#ebdffa);font-size:5rem}
.petbox.chomp .pimg{animation:chomp .5s 2}.petbox.wash .pimg{animation:wash .35s 4}
@keyframes chomp{50%{transform:scale(1.1,.92)}}
@keyframes wash{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.say{position:absolute;top:-14px;right:-18px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px 12px;font-size:.95rem;
box-shadow:0 6px 16px rgba(238,134,168,.25);max-width:160px;line-height:1.3}
.fx span{position:absolute;pointer-events:none;font-size:30px}
.fx .food{left:50%;top:-20px;animation:drop .8s ease-in forwards}
.fx .bub{bottom:10px;animation:rise 1.4s ease-out forwards}
@keyframes drop{to{transform:translateY(120px);opacity:0}}
@keyframes rise{to{transform:translateY(-160px);opacity:0}}
.bars{display:grid;gap:10px;margin:0 auto 18px;max-width:340px;text-align:left}
.bar span{font-size:.9rem;color:var(--mute)}
.bar i{display:block;height:14px;border-radius:10px;background:#ffe3ec;overflow:hidden;margin-top:2px}
.bar b{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#f8bcd0,var(--rose));transition:width .5s}
.pbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pbtns .cta{font-size:1.4rem;padding:8px 22px}
/* Puzzle */
.pzboard{display:grid;gap:4px;width:min(100%,380px);aspect-ratio:1;margin:0 auto 14px}
.pz{position:relative;overflow:hidden;border:0;padding:0;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#ffe3ec,#ebdffa);font:400 2.4rem var(--script);color:var(--rose-d)}
.pz img{position:absolute;max-width:none;object-fit:cover;pointer-events:none}
.pz.sel{outline:3px solid var(--rose);transform:scale(.94)}
.pz.ok{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.pzboard.done{gap:0}.pzboard.done .pz{border-radius:0}
.pzwin{font-family:var(--script);font-size:1.8rem;color:var(--rose-d);min-height:1.4em;margin-top:6px}
/* Moment */
.moment{max-width:520px;margin:0 auto;text-align:center}
.moment .ph{aspect-ratio:4/5;max-height:70vh;width:100%;margin:0 auto 24px;border:10px solid #fff;border-radius:6px;transform:rotate(-1.5deg);
box-shadow:0 14px 36px rgba(190,90,130,.3);background:linear-gradient(135deg,#ffe3ec,#ebdffa);font-size:5rem}
.moment h2{margin-bottom:12px}
.moment p{font:400 clamp(1.7rem,6vw,2.2rem)/1.3 var(--script);color:var(--ink)}
/* New Year */
.card.wide{max-width:860px}
.card .counter{margin:0 0 18px}
.card ul{list-style:none;padding:0;margin:14px 0 22px;display:grid;gap:6px;color:var(--ink)}
.nygrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nygrid .ph{margin:0;aspect-ratio:auto;min-height:300px;height:100%;border:6px solid #fff;border-radius:18px;box-shadow:0 8px 22px rgba(190,90,130,.25);background:linear-gradient(135deg,#ffe3ec,#ebdffa);font-size:4rem}
.nygrid iframe{width:100%;height:100%;min-height:300px;border:0;border-radius:18px;box-shadow:0 8px 22px rgba(190,90,130,.25)}
.maplink{display:inline-block;margin-top:10px;color:var(--rose-d);font-size:.95rem}
@media(max-width:640px){.nygrid{grid-template-columns:1fr}}

/* Stars */
.sky{position:relative;max-width:640px;margin:0 auto;border-radius:28px;overflow:hidden;border:3px solid #fff;cursor:pointer;
box-shadow:0 16px 44px rgba(150,70,130,.4);background:radial-gradient(ellipse at 50% 125%,#a2457f 0,transparent 60%),linear-gradient(#2a1850,#4d2a74)}
.sky canvas{display:block;width:100%;height:auto;aspect-ratio:6/5}
.skyhint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#ffe3ef;font:400 1.6rem var(--script);pointer-events:none;
transition:opacity .5s;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.sky.go{cursor:default}.sky.go .skyhint{opacity:0;animation:none}
.sttext{text-align:center;margin-top:26px;opacity:0;transform:translateY(12px);transition:opacity 1.2s,transform 1.2s;pointer-events:none}
.sttext.on{opacity:1;transform:none;pointer-events:auto}
.sttext p:first-child{font:400 clamp(2.2rem,8vw,3.2rem)/1.15 var(--script);color:var(--rose-d)}
.sttext p+p{font-size:1.15rem;margin:8px auto 18px;max-width:34ch}

/* Reasons */
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.rs{background:#fff;border:2px solid var(--line);border-radius:26px;padding:24px 22px;cursor:pointer;
text-align:left;color:var(--ink);font:inherit;transition:transform .25s,background .25s;box-shadow:0 8px 20px rgba(238,134,168,.15)}
.rs:hover{transform:translateY(-3px)}
.rs .q{font-family:var(--script);font-size:1.6rem;color:var(--rose-d)}
.rs .a{display:none;margin-top:8px}
.rs.open{background:var(--peach)}.rs.open .a{display:block}

/* Letter */
.letter{background:#fff;border:2px dashed var(--pink);border-radius:28px;padding:clamp(28px,6vw,56px);
box-shadow:0 18px 50px rgba(238,134,168,.25);max-width:700px;margin:0 auto}
.letter p{margin-bottom:1em}.letter .sig{font-family:var(--script);font-size:2.1rem;color:var(--rose-d);margin:0}

/* Question */
.ask{text-align:center}
.ask h2{font-size:clamp(2.6rem,9vw,4.6rem);color:var(--rose-d)}
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:64px;position:relative}
button.cta{font:400 1.7rem var(--script);padding:10px 36px;border-radius:40px;border:0;cursor:pointer;
background:var(--rose);color:#fff;box-shadow:0 8px 18px rgba(238,134,168,.4)}
button.cta.alt{background:#fff;border:2px solid var(--line);color:var(--mute);box-shadow:none}
.ans{font-family:var(--script);font-size:2.4rem;color:var(--rose-d);margin-top:24px;min-height:3em}
footer{text-align:center;color:var(--mute);padding:40px 24px 60px;font-size:.9rem}
.heart{position:fixed;pointer-events:none;z-index:70;font-size:24px;animation:pop 1.6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.petal{display:none}html{scroll-behavior:auto}.heart{animation-duration:.01s}.seal,.lion{animation:none}}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
</style>
</head>
<body class="locked">

<div id="intro">
  <p class="to" id="introTo"></p>
  <button class="env" id="env" aria-label="Открыть письмо">
    <div class="env-back"></div>
    <div class="env-letter" id="introCard"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </button>
  <p class="hint" id="hint">нажми на конверт</p>
  <div class="lion" id="lion" title="Лион">
    <svg viewBox="0 0 100 120" aria-hidden="true">
      <path d="M50 28 C25 40 18 85 12 112 H88 C82 85 75 40 50 28Z" fill="#8a4fd0"/>
      <line x1="62" y1="55" x2="88" y2="24" stroke="#8a4fd0" stroke-width="10" stroke-linecap="round"/>
      <circle cx="90" cy="20" r="9" fill="#c77dff" opacity=".55"/><circle cx="90" cy="20" r="5" fill="#f3c6dc"/>
      <circle cx="50" cy="32" r="16" fill="#f3c6dc"/>
      <path d="M30 36 C28 6 72 6 70 36 C62 24 38 24 30 36Z" fill="#5b2a9a"/>
      <circle cx="44" cy="35" r="2.6" fill="#7a2fd0"/><circle cx="56" cy="35" r="2.6" fill="#7a2fd0"/>
    </svg>
  </div>
</div>
<svg id="bolt" aria-hidden="true"></svg>
<div class="flash" id="flash"></div>
<div class="fod" id="fod"></div>

<header class="hero" id="top">
  <h1 id="hName">Любимая</h1>
  <p class="sub" id="hSub"></p>
  <div class="counter" id="counter" aria-live="off"></div>
  <p class="since" id="since"></p>
  <a class="down" href="#album">наш альбом ↓</a>
</header>

<section id="album"><h2>Наш альбом</h2>
  <div class="book" id="book">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="cover"><div class="paper" id="paper"></div></div>
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Назад">‹</button>
      <span id="pg"></span>
      <button class="arrow" id="next" aria-label="Вперёд">›</button>
    </div>
  </div>
</section>
<section id="pet"><h2 id="petTitle"></h2><div class="card">
  <div class="petbox" id="petBox"><div class="pimg" id="petImg"></div><div class="say" id="petSay"></div><div class="fx" id="petFx"></div></div>
  <div class="bars">
    <div class="bar"><span>Сытость</span><i><b id="bHunger"></b></i></div>
    <div class="bar"><span>Чистота</span><i><b id="bClean"></b></i></div>
  </div>
  <div class="pbtns"><button class="cta" id="bFeed">Покормить 🍖</button><button class="cta" id="bBath">Искупать 🛁</button></div>
</div></section>
<section id="why"><h2>За что я тебя люблю</h2><div class="reasons" id="reasons"></div></section>
<section id="quiz"><h2>Как хорошо ты все помнишь?</h2><div class="card" id="quizBox"></div></section>
<section id="puzzle"><h2 id="pzTitle"></h2><div class="card">
  <div class="pzboard" id="pzBoard"></div>
  <p class="gnote">нажми на два кусочка, чтобы поменять их местами</p>
  <div class="pzwin" id="pzWin"></div>
</div></section>
<section id="gamesec"><h2>Полетаем?</h2>
  <div class="gwrap"><div class="gbox"><canvas id="game" width="360" height="540" aria-label="Мини-игра"></canvas>
    <div class="gbanner" id="gbanner"><div class="big" id="gbTitle"></div><p id="gbText"></p><button class="cta" id="gbtn">Сыграть ещё</button></div></div>
  <p class="gnote">нажимай на игру или пробел, чтобы взмахнуть крыльями</p></div></section>
<section id="surprise"><h2 id="scTitle"></h2>
  <div class="scratch"><div class="under" id="scText"></div><canvas id="scCanvas"></canvas></div></section>

const $ = id => document.getElementById(id);
$('hName').textContent = CONFIG.herName;
$('hSub').textContent = CONFIG.subtitle;
$('askQ').textContent = CONFIG.question;
$('foot').textContent = CONFIG.footer;
document.title = 'Для Иры';

const start = new Date(CONFIG.startDate);
$('since').textContent = 'Мы начали встречаться ' + start.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});

function plural(n, f){ const m=n%10, h=n%100; return f[(h>10&&h<20)?2:m===1?0:(m>1&&m<5)?1:2]; }
function tick(){
  let d = Math.max(0, Date.now() - start.getTime());
  const days = Math.floor(d/864e5), hrs = Math.floor(d%864e5/36e5),
        min = Math.floor(d%36e5/6e4), sec = Math.floor(d%6e4/1e3);
  $('counter').innerHTML = [
    [days, ['день','дня','дней']], [hrs, ['час','часа','часов']],
    [min, ['минута','минуты','минут']], [sec, ['секунда','секунды','секунд']]
  ].map(([n,f]) => `<div><b>${n}</b><span>${plural(n,f)}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);

// Фото с заглушкой, если файла ещё нет
function photo(src, emoji, alt){
  const box = document.createElement('div'); box.className = 'ph';
  const fallback = () => { box.textContent = emoji || '♥'; };
  if(!src){ fallback(); return box; }
  const img = new Image(); img.alt = alt || ''; img.loading = 'lazy'; img.src = src;
  img.onerror = fallback; box.appendChild(img);
  return box;
}

const lb = $('lb');
let cur = 0, page = 0, busy = false;
const paper = $('paper');
function render(){
  const a = CONFIG.albums[cur], p = a.pages[page];
  paper.innerHTML = '';
  const ph = photo(p.photo, p.emoji, p.caption || 'Наше фото');
  ph.onclick = () => { const im = ph.querySelector('img'); if(im){ lb.querySelector('img').src = im.src; lb.classList.add('on'); } };
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = p.caption || '';
  paper.append(ph, cap);
  $('pg').textContent = (page+1) + ' / ' + a.pages.length;
  $('prev').disabled = page === 0;
  $('next').disabled = page === a.pages.length-1;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===cur));
}
function flip(dir, apply){
  if(busy) return; busy = true;
  paper.classList.add(dir>0 ? 'out-n' : 'out-p');
  setTimeout(() => { apply(); render(); paper.classList.remove('out-n','out-p'); busy = false; }, 350);
}
const go = d => { const n = page+d; if(n>=0 && n<CONFIG.albums[cur].pages.length) flip(d, () => page = n); };
CONFIG.albums.forEach((a,i) => {
  const t = document.createElement('button'); t.className = 'tab'; t.textContent = a.name;
  t.onclick = () => { if(i!==cur) flip(i>cur?1:-1, () => { cur = i; page = 0; }); };
  $('tabs').appendChild(t);
});
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
let sx = null;
$('book').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
$('book').addEventListener('touchend', e => { if(sx===null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if(Math.abs(dx)>50) go(dx<0?1:-1); });
addEventListener('keydown', e => { if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
render();

lb.onclick = () => lb.classList.remove('on');
addEventListener('keydown', e => e.key==='Escape' && lb.classList.remove('on'));

// Сердечки по клику
function burst(x,y,n=14){
  for(let i=0;i<n;i++){
    const h = document.createElement('span'); h.className='heart';
    h.textContent = ['♥','💖','💕','✨'][i%4];
    h.style.left = x+'px'; h.style.top = y+'px';
    h.style.setProperty('--x', (Math.random()*240-120)+'px');
    h.style.setProperty('--y', (-60-Math.random()*200)+'px');
    document.body.appendChild(h); setTimeout(()=>h.remove(), 1700);
  }
}
$('yes').onclick = e => {
  burst(e.clientX, e.clientY, 36);

// Кнопка «Нет» убегает :)
const no = $('no');

  const r = $('btns').getBoundingClientRect();
  no.style.position='absolute';
  no.style.left = Math.random()*(r.width-no.offsetWidth)+'px';
  no.style.top = (Math.random()*60-10)+'px';

no.addEventListener('mouseenter', dodge);
no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, {passive:false});

// ===== Квиз =====
let qi = 0, qScore = 0;
function showQuiz(){
  const box = $('quizBox'), Q = CONFIG.quiz;
  box.innerHTML = '';
  if(qi >= Q.length){
    const r = CONFIG.quizResults, k = qScore/Q.length;
    const msg = r[k < .5 ? 0 : k < 1 ? 1 : 2];
    box.innerHTML = '<div class="big"></div><h3></h3><button class="cta" id="again">Ещё раз</button>';
    box.querySelector('.big').textContent = qScore + ' из ' + Q.length;
    box.querySelector('h3').textContent = msg;
    $('again').onclick = () => { qi = 0; qScore = 0; showQuiz(); };
    if(k === 1) burst(innerWidth/2, innerHeight/2, 30);
    return;
  }
  const q = Q[qi];
  box.innerHTML = '<div class="qn"></div><h3></h3><div class="opts"></div>';
  box.querySelector('.qn').textContent = (qi+1) + ' / ' + Q.length;
  box.querySelector('h3').textContent = q.q;
  q.o.forEach((t,i) => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = t;
    b.onclick = () => {
      box.querySelectorAll('.opt').forEach(x => x.disabled = true);
      b.classList.add(i === q.a ? 'ok' : 'bad');
      if(i !== q.a) box.querySelectorAll('.opt')[q.a].classList.add('ok'); else qScore++;
      setTimeout(() => { qi++; showQuiz(); }, 1000);
    };
    box.querySelector('.opts').appendChild(b);
  });
}
showQuiz();

// ===== Стёрка =====
$('scTitle').textContent = CONFIG.scratchTitle;
$('scText').textContent = CONFIG.scratchText;
(function(){
  const c = $('scCanvas'), ctx = c.getContext('2d');
  const w = 440, h = 293; c.width = w * 2; c.height = h * 2; ctx.scale(2,2);
  const g = ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#f6b8cf'); g.addColorStop(.5,'#e9d3f5'); g.addColorStop(1,'#f6b8cf');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '400 34px "Marck Script",cursive'; ctx.textAlign = 'center';
  ctx.fillText('Потри здесь ✨', w/2, h/2 + 10);
  ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 36; ctx.lineCap = 'round';
  let down = false, last = null, done = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX-r.left)*w/r.width, (e.clientY-r.top)*h/r.height]; };
  c.onpointerdown = e => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); scratch(last, last); };
  c.onpointermove = e => { if(!down) return; const p = pos(e); scratch(last, p); last = p; };
  c.onpointerup = () => { down = false; check(); };
  function scratch(a,b){ ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0]+.01,b[1]); ctx.stroke(); }
  function check(){
    if(done) return;
    const d = ctx.getImageData(0,0,c.width,c.height).data; let n = 0, t = 0;
    for(let i = 3; i < d.length; i += 64){ t++; if(d[i] === 0) n++; }
    if(n/t > .5){ done = true; c.style.opacity = 0; c.style.pointerEvents = 'none'; const r = c.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 28); }
  }
})();

// ===== Мини-игра =====
(function(){
  const cv = $('game'), x = cv.getContext('2d'), W = 360, H = 540, G = 0, GAP = 160, PW = 84, BX = 90, R = 13;
  let st = 'ready', y, vy, pipes, score, best = 0, last = 0;
  const A = {};
  Object.entries(CONFIG.gameAssets || {}).forEach(([k,src]) => { if(!src) return; const im = new Image(); im.onload = () => { A[k] = im; if(st !== 'play') draw(); }; im.src = src; });
  try{ best = +localStorage.getItem('irabest') || 0; }catch(e){}
  function reset(){ y = H/2 - 40; vy = 0; pipes = []; score = 0; draw(); }
  function flap(){
    if(st === 'won') return;
    if(st === 'over'){ reset(); st = 'ready'; return; }
    if(st === 'ready'){ st = 'play'; last = performance.now(); requestAnimationFrame(loop); }
    vy = -7.4;
  }
  function loop(t){
    if(st !== 'play') return;
    const k = Math.min(2, (t - last)/16.67); last = t;
    vy += .46*k; y += vy*k;
    if(!pipes.length || pipes[pipes.length-1].x < W - 200) pipes.push({x: W+10, top: 70 + Math.random()*(H - G - GAP - 140), passed: false});
    pipes.forEach(p => p.x -= 2.5*k);
    pipes = pipes.filter(p => p.x > -PW-10);
    let dead = y < R || y > H - G - R;
    pipes.forEach(p => {
      if(!p.passed && p.x + PW < BX){ p.passed = true; score++; if(score >= CONFIG.gameGoal && st === 'play'){ st = 'won'; showWin(); } }
      if(BX + R > p.x + PW*.2 && BX - R < p.x + PW*.8 && (y - R < p.top - 6 || y + R > p.top + GAP + 6)) dead = true;
    });
    if(dead && st === 'play'){ st = 'over'; if(score > best){ best = score; try{ localStorage.setItem('irabest', best); }catch(e){} } }
    draw(); if(st === 'play') requestAnimationFrame(loop);
  }
  function pipe(px, top){
    const bh = H - G - top - GAP;
    if(A.pipe){
      // сталактит сверху: как в картинке, основание у потолка, острие вниз
      x.drawImage(A.pipe, px, -4, PW, top + 4);
      // сталагмит снизу: та же картинка, перевёрнутая, основание у пола
      x.save(); x.translate(px, H - G + 4); x.scale(1, -1); x.drawImage(A.pipe, 0, 0, PW, bh + 4); x.restore();
      return;
    }
    x.fillStyle = '#cdb4e8';
    x.beginPath(); x.moveTo(px, -4); x.lineTo(px + PW, -4); x.lineTo(px + PW*.56, top); x.lineTo(px + PW*.44, top); x.fill();
    x.beginPath(); x.moveTo(px, H); x.lineTo(px + PW, H); x.lineTo(px + PW*.56, top + GAP); x.lineTo(px + PW*.44, top + GAP); x.fill();
  }
  function text(t, py, size){ x.fillStyle = '#fff'; x.strokeStyle = '#d9648c'; x.lineWidth = 5; x.lineJoin = 'round';
    x.font = size + 'px "Marck Script",cursive'; x.textAlign = 'center'; x.strokeText(t, W/2, py); x.fillText(t, W/2, py); }
  function draw(){
    if(A.bg){
      const k = Math.max(W / A.bg.width, H / A.bg.height), sw = W / k, sh = H / k;
      x.drawImage(A.bg, (A.bg.width - sw)/2, (A.bg.height - sh)/2, sw, sh, 0, 0, W, H);
    } else {
      const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffd6e4'); g.addColorStop(1,'#f1e3fb');
      x.fillStyle = g; x.fillRect(0,0,W,H);
    }
    pipes.forEach(p => pipe(p.x, p.top));
    x.save(); x.translate(BX, y); x.rotate(Math.max(-.5, Math.min(.7, vy*.07)));
    if(A.bird){ const bh = 46, bw = bh * A.bird.width / A.bird.height; x.drawImage(A.bird, -bw/2, -bh/2, bw, bh); }
    else { x.font = '36px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(CONFIG.gameBird, 0, 2); }
    x.restore(); x.textBaseline = 'alphabetic';
    text(score, 70, 54);
    if(st === 'ready') text('Нажми, чтобы лететь', H/2 + 50, 34);
    if(st === 'over'){ text('Счёт: ' + score + ' · рекорд: ' + best, H/2 - 10, 32); text('Нажми ещё раз', H/2 + 36, 30); }
  }
  function showWin(){
    if(score > best){ best = score; try{ localStorage.setItem('irabest', best); }catch(e){} }
    draw();
    $('gbTitle').textContent = CONFIG.gameWinTitle; $('gbText').textContent = CONFIG.gameWin;
    $('gbanner').classList.add('on'); burst(innerWidth/2, innerHeight/2, 36);
  }
  $('gbtn').onclick = () => { $('gbanner').classList.remove('on'); reset(); st = 'ready'; draw(); };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  addEventListener('keydown', e => {
    if(e.code !== 'Space') return;
    const r = cv.getBoundingClientRect();
    if(r.top < innerHeight && r.bottom > 0 && !document.body.classList.contains('locked')){ e.preventDefault(); flap(); }
  });
  reset();
})();

(function(){
  const P = CONFIG.pet; let hunger = 25, clean = 25, finished = false;
  $('petTitle').textContent = P.title;
  $('petImg').appendChild(photo(P.photo, P.emoji, 'Питомец'));
  const box = $('petBox'), fx = $('petFx');
  function update(){
    $('bHunger').style.width = hunger + '%'; $('bClean').style.width = clean + '%';
    $('petImg').style.filter = `sepia(${((100-clean)/100*.9).toFixed(2)}) saturate(${(.6+.4*clean/100).toFixed(2)})`;
    $('petSay').textContent = (hunger >= 100 && clean >= 100) ? P.doneText : hunger < 60 ? 'Я голодный 🥺' : clean < 60 ? 'Хочу в ванну 🛁' : 'Почти идеально ✨';
    if(hunger >= 100 && clean >= 100 && !finished){ finished = true; const r = box.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 30); }
  }
  function anim(cls, n, cls2, emoji){
    box.classList.remove('chomp','wash'); void box.offsetWidth; box.classList.add(cls);
    for(let i = 0; i < n; i++){
      const s = document.createElement('span'); s.className = cls2; s.textContent = emoji;
      s.style.left = (cls2 === 'bub' ? 10 + Math.random()*80 : 40 + Math.random()*20) + '%';
      s.style.animationDelay = (i*.12) + 's'; fx.appendChild(s); setTimeout(() => s.remove(), 1600 + i*120);
    }
  }
  $('bFeed').onclick = () => { hunger = Math.min(100, hunger + 25); anim('chomp', 3, 'food', '🍖'); update(); };
  $('bBath').onclick = () => { clean = Math.min(100, clean + 25); anim('wash', 6, 'bub', '🫧'); update(); };
  update();
})();

// ===== Пазл =====
(function(){
  const Z = CONFIG.puzzle, N = 3, board = $('pzBoard');
  $('pzTitle').textContent = Z.title;
  let order, sel = -1, solved = false;
  const isSolved = () => order.every((t,i) => t === i);
  function shuffle(){
    do{ order = [...Array(N*N).keys()];
      for(let k = 0; k < 6; k++){ const a = Math.floor(Math.random()*N*N); let b = Math.floor(Math.random()*N*N); if(a === b) b = (b+1) % (N*N); [order[a], order[b]] = [order[b], order[a]]; }
    } while(isSolved());
    sel = -1; solved = false; $('pzWin').textContent = ''; board.classList.remove('done');
  }
  function render(){
    board.style.gridTemplateColumns = `repeat(${N},1fr)`; board.innerHTML = '';
    order.forEach((t,pos) => {
      const c = document.createElement('button'); c.className = 'pz' + (pos === sel ? ' sel' : '') + (t === pos && !solved ? ' ok' : '');
      const im = document.createElement('img'); im.alt = ''; im.src = Z.photo;
      im.style.cssText = `width:${N*100}%;height:${N*100}%;left:${-(t%N)*100}%;top:${-Math.floor(t/N)*100}%`;
      im.onerror = () => { im.remove(); c.textContent = t + 1; };
      c.appendChild(im); c.onclick = () => pick(pos); board.appendChild(c);
    });
  }
  function pick(pos){
    if(solved) return;
    if(sel < 0){ sel = pos; }
    else if(sel === pos){ sel = -1; }
    else { [order[sel], order[pos]] = [order[pos], order[sel]]; sel = -1;
      if(isSolved()){ solved = true; board.classList.add('done'); $('pzWin').textContent = Z.winText;
        const r = board.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 30); } }
    render();
  }
  shuffle(); render();
})();

      .map(([n,f]) => `<div><b>${n}</b><span>${plural(n,f)}</span></div>`).join('');
  }

// ===== Звёздное небо =====
(function(){
  const S = CONFIG.stars; $('stTitle').textContent = S.title; $('skyHint').textContent = S.hint;
  $('stL1').textContent = S.line1; $('stL2').textContent = S.line2;
  const cv = $('skyCv'), c = cv.getContext('2d'), sky = $('sky'), W = 600, H = 500;
  c.scale(2, 2);
  const gl = (ox, w, pts) => pts.map(p => [ox + p[0]*w, 85 + p[1]*150]);
  const raw = [
    ...[[[0,0],[0,1]], [[1,0],[1,1]], [[1,0],[0,1]]].map(p => gl(95, 110, p)),                       // И
    gl(245, 110, [[0,1],[0,0],[.8,0],[1,.2],[1,.4],[.8,.6],[0,.6]]),                                   // Р
    ...[[[0,1],[.5,0],[1,1]], [[.22,.66],[.78,.66]]].map(p => gl(395, 110, p))                         // А
  ];
  const heart = [];
  for(let i = 0; i <= 14; i++){ const t = i/14*Math.PI*2;
    heart.push([300 + 16*Math.pow(Math.sin(t),3)*5.2, 372 - (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))*5.2]); }
  raw.push(heart);
  const nodes = [], idx = {}, segs = [];
  raw.forEach(st => st.forEach((p,i) => {
    const k = p[0].toFixed(0) + ',' + p[1].toFixed(0);
    if(!(k in idx)){ idx[k] = nodes.length; nodes.push({tx: p[0], ty: p[1], sx: 0, sy: 0}); }
    if(i > 0){ const pk = st[i-1][0].toFixed(0) + ',' + st[i-1][1].toFixed(0); segs.push([idx[pk], idx[k]]); }
  }));
  const bg = Array.from({length: 80}, () => ({x: Math.random()*W, y: Math.random()*H, r: .5 + Math.random()*1.4, ph: Math.random()*6, sp: 1 + Math.random()*2}));
  const scatter = () => nodes.forEach(n => { n.sx = 40 + Math.random()*(W-80); n.sy = 30 + Math.random()*(H-60); });
  scatter();
  const MOVE = 1.8, L0 = 1.2, LD = 2.4, END = 4.2;
  let t0 = null, done = false, vis = false, running = false;
  const clamp = v => Math.max(0, Math.min(1, v));
  function draw(now){
    c.clearRect(0, 0, W, H);
    bg.forEach(s => { c.globalAlpha = .25 + .75*Math.abs(Math.sin(now*s.sp + s.ph)); c.fillStyle = '#fff'; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); });
    c.globalAlpha = 1;
    const el = t0 === null ? -1 : now - t0;
    const e = 1 - Math.pow(1 - clamp(el/MOVE), 3);
    const pos = nodes.map(n => el < 0 ? [n.sx, n.sy] : [n.sx + (n.tx-n.sx)*e, n.sy + (n.ty-n.sy)*e]);
    const gap = LD / segs.length;
    c.lineCap = 'round'; c.strokeStyle = 'rgba(255,225,240,.9)'; c.lineWidth = 2; c.shadowColor = '#ffb3d1'; c.shadowBlur = 8;
    segs.forEach((sg, i) => {
      const f = clamp((el - L0 - i*gap) / (gap*1.5)); if(f <= 0) return;
      const a = pos[sg[0]], b = pos[sg[1]];
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f); c.stroke();
    });
    c.shadowBlur = 14;
    nodes.forEach((n, i) => {
      const r = 2.6 + 1.2*Math.sin(now*3 + i) + (done ? 1 : 0);
      c.fillStyle = '#fff'; c.beginPath(); c.arc(pos[i][0], pos[i][1], r, 0, 7); c.fill();
    });
    c.shadowBlur = 0;
    if(el > END && !done){ done = true; $('stText').classList.add('on'); const r = sky.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 26); }
  }
  function loop(t){ if(!vis){ running = false; return; } draw(t/1000); requestAnimationFrame(loop); }
  new IntersectionObserver(en => { vis = en[0].isIntersecting; if(vis && !running){ running = true; requestAnimationFrame(loop); } }).observe(sky);
  sky.onclick = () => { if(t0 === null){ t0 = performance.now()/1000; sky.classList.add('go'); } };
  $('stAgain').onclick = () => { t0 = null; done = false; scatter(); sky.classList.remove('go'); $('stText').classList.remove('on'); };
})();

// Звук
const bgm = CONFIG.music ? new Audio(CONFIG.music) : null;
const ult = CONFIG.ultSound ? new Audio(CONFIG.ultSound) : null;
if(bgm){ bgm.loop = true; bgm.volume = 0; bgm.preload = 'auto'; }
let wasPlaying = false;
function startMusic(){
  if(!bgm) return;
  bgm.volume = 0;
  bgm.play().then(() => {
    setTimeout(() => { let v = 0; const t = setInterval(() => {
      v = Math.min(CONFIG.musicVolume, v + 0.02); bgm.volume = v; if(v >= CONFIG.musicVolume) clearInterval(t);
    }, 80); }, 900);
  }).catch(() => {});
}
function syncSnd(){ const b = $('snd'); b.textContent = (bgm && !bgm.paused) ? '♪' : '🔇'; b.classList.toggle('off', !(bgm && !bgm.paused)); }
$('snd').onclick = () => {
  if(!bgm) return;
  if(bgm.paused){ bgm.volume = CONFIG.musicVolume; bgm.play().catch(()=>{}); } else bgm.pause();
  setTimeout(syncSnd, 50);
};
document.addEventListener('visibilitychange', () => {
  if(!bgm) return;
  if(document.hidden){ wasPlaying = !bgm.paused; bgm.pause(); }
  else if(wasPlaying){ bgm.play().catch(()=>{}); }
});
function openEnvelope(){
  const env = $('env'); env.classList.add('open');
  const r = env.getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width/2, r.top + r.height/2, 26), 700);
  setTimeout(() => { $('intro').classList.add('done'); document.body.classList.remove('locked'); scrollTo(0,0); if(bgm){ $('snd').hidden = false; syncSnd(); } }, 2000);
}
function cast(){
  const env = $('env'); if(env.dataset.busy) return; env.dataset.busy = 1;
  $('hint').style.opacity = 0; lion.classList.add('cast');
  if(ult){ ult.currentTime = 0; ult.play().catch(() => {}); }
  startMusic();
  const lr = lion.getBoundingClientRect(), er = env.getBoundingClientRect();
  const x1 = lr.left + lr.width*hand[0], y1 = lr.top + lr.height*hand[1];
  const x2 = er.left + er.width/2, y2 = er.top + er.height/2;
  const pts = [[x1,y1]];
  for(let i=1;i<9;i++){ const t=i/9; pts.push([x1+(x2-x1)*t+(Math.random()-.5)*46, y1+(y2-y1)*t+(Math.random()-.5)*30]); }
  pts.push([x2,y2]);
  const d = 'M' + pts.map(p => p[0].toFixed(0)+','+p[1].toFixed(0)).join(' L');
  const svg = $('bolt');
  svg.innerHTML = `<path d="${d}" stroke="#b266ff" stroke-width="16" opacity=".5"/><path d="${d}" stroke="#f6e4ff" stroke-width="4"/>`;
  svg.querySelectorAll('path').forEach(p => {
    const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset .2s linear'; p.style.strokeDashoffset = 0;
  });
  setTimeout(() => {
    $('flash').classList.add('on');
    $('fod').textContent = CONFIG.castText; $('fod').classList.add('on');
    env.classList.add('hit');
  }, 220);
  setTimeout(() => { svg.innerHTML = ''; env.classList.remove('hit'); openEnvelope(); }, 750);
}
$('env').onclick = cast;
lion.onclick = cast;
</script>
